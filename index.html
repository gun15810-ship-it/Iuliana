<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя, Юлианочка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #06020f; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; }
        
        #envelope-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity 1s ease; position: absolute; width: 100%; height: 100%; }
        .title { color: #fff; font-size: 24px; margin-bottom: 30px; text-align: center; text-shadow: 0 0 15px rgba(255,255,255,0.6); padding: 0 20px; font-weight: bold; }
        .envelope { width: 220px; height: 150px; background: #ff4d6d; position: relative; border-radius: 0 0 10px 10px; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; transition: transform 0.3s; }
        .envelope:active { transform: scale(0.95); }
        .envelope::before { content: ''; position: absolute; top: -78px; left: 0; border-left: 110px solid transparent; border-right: 110px solid transparent; border-bottom: 80px solid #ff4d6d; width: 0; height: 0; }
        .btn-open { position: absolute; background: #fff; color: #ff4d6d; border: none; padding: 12px 24px; font-weight: bold; border-radius: 25px; font-size: 14px; pointer-events: none; z-index: 2; box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-transform: uppercase; letter-spacing: 1px; }
        
        #galaxy-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #action-btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: #ff4d6d; color: #fff; border: none; padding: 16px 36px; font-size: 18px; border-radius: 35px; cursor: pointer; box-shadow: 0 0 25px #ff4d6d; display: none; z-index: 20; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
        #action-btn:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 0 10px #ff4d6d; }
    </style>
</head>
<body>

    <div id="envelope-screen">
        <h1 class="title">Это для тебя, Юлианочка</h1>
        <div class="envelope" onclick="openEnvelope()">
            <button class="btn-open">Открыть конверт</button>
        </div>
    </div>

    <div id="galaxy-screen">
        <canvas id="galaxyCanvas"></canvas>
        <button id="action-btn" onclick="assemblePortrait()">Проявить портрет</button>
    </div>

    <script>
        // Специальный обход блокировки картинок ImgBB
        const photoUrl = 'IMG_20261013_025235_276.jpg';

        const phrases = ["Я тебя люблю", "I love you", "Te amo", "Je t'aime", "Ti amo", "❤️", "Юлиана"];
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let targets = [];
        let animationFrame;
        let mode = 'galaxy';

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function openEnvelope() {
            document.getElementById('envelope-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('envelope-screen').style.display = 'none';
                const galaxyScreen = document.getElementById('galaxy-screen');
                galaxyScreen.style.opacity = '1';
                galaxyScreen.style.pointerEvents = 'auto';
                preparePortrait();
            }, 1000);
        }

        function preparePortrait() {
            const img = new Image();
            img.src = photoUrl;
            img.onload = function() {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                const pWidth = 140;
                const pHeight = (img.height / img.width) * pWidth;
                tempCanvas.width = pWidth;
                tempCanvas.height = pHeight;
                
                tempCtx.drawImage(img, 0, 0, pWidth, pHeight);
                const imgData = tempCtx.getImageData(0, 0, pWidth, pHeight).data;
                
                const scale = Math.min(canvas.width / pWidth, canvas.height / pHeight) * 0.85;
                const startX = (canvas.width - pWidth * scale) / 2;
                const startY = (canvas.height - pHeight * scale) / 2.5;

                for (let y = 0; y < pHeight; y += 3) {
                    for (let x = 0; x < pWidth; x += 3) {
                        const index = (y * pWidth + x) * 4;
                        const r = imgData[index];
                        const g = imgData[index + 1];
                        const b = imgData[index + 2];
                        const brightness = (r + g + b) / 3;

                        if (brightness < 160) { 
                            targets.push({
                                x: startX + x * scale,
                                y: startY + y * scale
                            });
                        }
                    }
                }
                initGalaxy();
            };
        }

        class Particle {
            constructor(target) {
                this.text = phrases[Math.floor(Math.random() * phrases.length)];
                this.x = canvas.width / 2 + (Math.random() - 0.5) * 100;
                this.y = canvas.height / 2 + (Math.random() - 0.5) * 100;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 1.5 + 0.5;
                this.distance = Math.random() * Math.min(canvas.width, canvas.height) * 0.4 + 20;
                this.size = Math.random() * 5 + 9;
                this.alpha = Math.random() * 0.5 + 0.5;
                this.targetX = target.x;
                this.targetY = target.y;
                this.color = `hsl(${330 + Math.random() * 40}, 100%, ${65 + Math.random() * 15}%)`;
            }

            update() {
                if (mode === 'galaxy') {
                    this.angle += 0.007 * this.speed;
                    this.x = canvas.width / 2 + Math.cos(this.angle) * this.distance;
                    this.y = canvas.height / 2 + Math.sin(this.angle) * this.distance;
                } else if (mode === 'portrait') {
                    this.x += (this.targetX - this.x) * 0.05;
                    this.y += (this.targetY - this.y) * 0.05;
                    this.size = 7; 
                    this.alpha = 0.9;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function initGalaxy() {
            targets.forEach(t => {
                particles.push(new Particle(t));
            });
            if(particles.length > 900) particles = particles.slice(0, 900);
            animate();
            document.getElementById('action-btn').style.display = 'block';
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            animationFrame = requestAnimationFrame(animate);
        }

        function assemblePortrait() {
            cancelAnimationFrame(animationFrame);
            mode = 'portrait';
            document.getElementById('action-btn').style.display = 'none';
            animate();
        }
    </script>
</body>
</html>
